[project]
name = "tabloom-tabiclv2-spike"
version = "0.1.0"
description = "TabICL v2 GPU and browser-export feasibility spike for Tabloom"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.3,<3",
  "onnx==1.22.0",
  "onnxruntime==1.30.0",
  "onnxscript==0.7.2",
  "scikit-learn>=1.8,<2",
  "tabicl==2.2.0",
  "torch==2.14.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
